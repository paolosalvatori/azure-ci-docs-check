name: Page snippets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # github-actions.md: "Configuration", "Deploy with the Azure CLI" (Bicep) and "Save the LocalStack logs"
  config-bicep-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lstk
        run: npm install -g @localstack/lstk@1.2.0
      - name: Start LocalStack
        run: lstk start --type azure
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          LOCALSTACK_DEBUG: "1"
          LOCALSTACK_MSSQL_ACCEPT_EULA: "Y"
      - name: Check the forwarded variables inside the container
        run: |
          docker exec localstack-azure sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -E '^(DEBUG|MSSQL_ACCEPT_EULA)='
      - name: Set up the Azure CLI integration
        run: lstk setup azure

      - name: Deploy the infrastructure
        run: |
          lstk az group create --name my-rg --location westeurope
          lstk az deployment group create --resource-group my-rg --template-file main.bicep
      - name: Check the Bicep deployment
        run: lstk az storage account list --resource-group my-rg --query "[].name" --output tsv
      - name: Save the LocalStack logs
        if: always()
        run: lstk logs --verbose > localstack.log

      - name: Upload the LocalStack logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localstack-logs
          path: localstack.log
      - name: Check that the logs contain DEBUG lines
        if: always()
        run: |
          wc -l localstack.log
          grep -c "DEBUG" localstack.log

  # best-practices.mdx: the committed .lstk/config.toml, without --type
  config-toml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-toml-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lstk
        run: npm install -g @localstack/lstk@1.2.0
      - name: Start LocalStack from .lstk/config.toml
        run: lstk start
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - name: Check the emulator type and the env profile
        run: |
          lstk status
          docker exec localstack-azure sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -E '^MSSQL_ACCEPT_EULA='
      - name: Check what lstk wrote next to the config
        run: |
          lstk setup azure
          ls -A .lstk

  # best-practices.mdx: interception and Terraform through ARM_* variables (block copied verbatim)
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lstk
        run: npm install -g @localstack/lstk@1.2.0
      - name: Start LocalStack
        run: lstk start --type azure
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Show the provider block (no metadata_host or subscription_id)
        run: cat terraform-test/providers.tf
      - name: Deploy with Terraform
        working-directory: terraform-test
        run: |
          lstk az start-interception
          export ARM_METADATA_HOSTNAME="azure.localhost.localstack.cloud:4566"
          export ARM_SUBSCRIPTION_ID="00000000-0000-0000-0000-000000000000"
          terraform init
          terraform apply -auto-approve
      - name: Check with plain az
        run: az group show --name tf-rg --query properties.provisioningState --output tsv

  # best-practices.mdx: without a config file, a non-interactive start picks the AWS emulator
  default-type:
    runs-on: ubuntu-latest
    steps:
      - name: Install lstk
        run: npm install -g @localstack/lstk@1.2.0
      - name: Start without a config file or --type
        run: |
          set +e
          timeout 30 lstk start > start.log 2>&1
          echo "exit=$?"
          head -5 start.log
          grep -F "Configured with default emulator" start.log
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  # github-actions.md: "Current limitations"
  windows:
    runs-on: windows-latest
    steps:
      - name: Docker on the Windows runner
        shell: bash
        run: |
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}' || echo "docker failed"
          npm install -g @localstack/lstk@1.2.0
          set +e
          lstk start --type azure 2>&1 | tail -20
          echo "lstk exit=${PIPESTATUS[0]}"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - name: Docker on the macOS runner
        run: |
          command -v docker || echo "docker is not installed"
          npm install -g @localstack/lstk@1.2.0
          set +e
          lstk start --type azure 2>&1 | tail -20
          echo "lstk exit=${PIPESTATUS[0]}"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
