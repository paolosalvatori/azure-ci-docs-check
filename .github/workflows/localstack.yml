name: Test against LocalStack for Azure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pull requests from forks don't receive LOCALSTACK_AUTH_TOKEN, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lstk
        run: npm install -g @localstack/lstk@1.2.0

      - name: Start LocalStack
        run: lstk start --type azure
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Set up the Azure CLI integration
        run: lstk setup azure

      - name: Deploy the infrastructure
        run: |
          lstk az group create --name my-rg --location westeurope
          lstk az storage account create --name mystorageaccount --resource-group my-rg --location westeurope --sku Standard_LRS

      - name: Run the tests
        # Replace this step with your own test command.
        run: lstk az storage account show --name mystorageaccount --resource-group my-rg --query provisioningState --output tsv

      - name: Save the LocalStack logs
        if: always()
        run: lstk logs --verbose > localstack.log

      - name: Upload the LocalStack logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localstack-logs
          path: localstack.log
